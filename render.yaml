services:
  - type: web
    name: live-archiver-resolver
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LIVE_ARCHIVER_API_KEY
        value: admin888
      - key: PYTHON_VERSION
        value: 3.12.0
